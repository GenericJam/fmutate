<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit in place: add, resize, pages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; background: #0E0D12; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden">
  <sc-for list="{{cells}}" as="c" hint-placeholder-count="84"><div style="position: absolute; left: {{c.l}}px; top: {{c.t}}px; width: {{c.w}}px; height: {{c.h}}px; border-radius: 8px; background: {{c.bg}}; box-shadow: inset 0 0 0 1px {{c.line}}"></div></sc-for>

  <sc-for list="{{ctrls}}" as="k" hint-placeholder-count="8">
    <div style="position: absolute; left: {{k.l}}px; top: {{k.t}}px; width: {{k.w}}px; height: {{k.h}}px; border-radius: 10px; background: {{k.bg}}; box-shadow: inset 0 0 0 {{k.ringW}}px {{k.ring}}; overflow: hidden">
      <sc-for list="{{k.keys}}" as="w" hint-placeholder-count="0"><div style="position: absolute; left: {{w.l}}px; top: 0; width: {{w.w}}px; height: {{w.h}}px; border-radius: 0 0 5px 5px; background: #ECE7F2"></div></sc-for>
      <sc-for list="{{k.pads}}" as="p" hint-placeholder-count="0"><div style="position: absolute; left: {{p.l}}px; top: {{p.t}}px; width: {{p.w}}px; height: {{p.h}}px; border-radius: 7px; background: #221F2B"></div></sc-for>
      <sc-if value="{{k.fill}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{k.fillH}}px; background: #3A3450"></div></sc-if>
      <span style="position: absolute; left: 8px; top: 8px; font: 700 11px/1.2 Inter, sans-serif">{{k.label}}</span>
    </div>
  </sc-for>

  <sc-for list="{{handles}}" as="h" hint-placeholder-count="4"><div style="position: absolute; left: {{h.l}}px; top: {{h.t}}px; width: 18px; height: 18px; border-radius: 9px; background: #C6F24E; box-shadow: 0 0 0 3px #0E0D12"></div></sc-for>
  <span style="position: absolute; left: {{badge.l}}px; top: {{badge.t}}px; padding: 4px 8px; border-radius: 8px; background: #C6F24E; color: #14121A; font: 700 11px/1.2 'JetBrains Mono', monospace; white-space: nowrap">pads · 4×3 · tap for bindings</span>

  <div style="position: absolute; left: {{plus.l}}px; top: {{plus.t}}px; width: {{plus.w}}px; height: {{plus.h}}px; border-radius: 8px; background: #F3EFF8; display: flex; align-items: center; justify-content: center; color: #14121A; font: 400 26px/1 Inter, sans-serif">+</div>

  <div style="position: absolute; left: 500px; top: 56px; width: 300px; border-radius: 18px; background: #F3EFF8; color: #14121A; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 4px"><span style="font-size: 14px; font-weight: 700">Add here</span><span style="font: 500 11px/1 'JetBrains Mono', monospace; color: #5E5870">room: 2 wide × 6 tall</span></div>
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="8">
      <button type="button" style="height: 30px; border-radius: 9px; border: none; background: {{m.bg}}; color: {{m.fg}}; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font: 600 13px Inter, sans-serif">{{m.name}}<span style="font: 500 11px/1 'JetBrains Mono', monospace; color: {{m.sub}}">{{m.size}}</span></button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 330px; top: 8px; height: 44px; padding: 0 4px 0 14px; border-radius: 22px; background: #F3EFF8; color: #14121A; display: flex; align-items: center; gap: 6px">
    <span style="font-size: 13px; font-weight: 700; margin-right: 4px">Editing</span>
    <button type="button" aria-label="Previous page" style="width: 32px; height: 36px; border: none; background: transparent; color: #14121A; font: 700 16px Inter, sans-serif">‹</button>
    <span style="font: 600 12px/1 'JetBrains Mono', monospace">Beat · 1/2</span>
    <button type="button" aria-label="Next page" style="width: 32px; height: 36px; border: none; background: transparent; color: #14121A; font: 700 16px Inter, sans-serif">›</button>
    <button type="button" style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: #E2DCEB; color: #14121A; font: 700 13px Inter, sans-serif">+ Page</button>
    <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #14121A; color: #C6F24E; font: 700 13px Inter, sans-serif">Done</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    var G = 8, cw = (788 - 13 * G) / 14, ch = (366 - 5 * G) / 6;
    var X = function (c) { return 28 + c * (cw + G); }, Y = function (r) { return 12 + r * (ch + G); };
    var W = function (n) { return n * cw + (n - 1) * G; }, H = function (n) { return n * ch + (n - 1) * G; };
    var cells = [];
    for (var r = 0; r < 6; r++) for (var c = 0; c < 14; c++) cells.push({ l: X(c).toFixed(1), t: Y(r).toFixed(1), w: cw.toFixed(1), h: ch.toFixed(1), bg: '#16141D', line: '#24212E' });
    var box = function (c, r, w, h, o) { return Object.assign({ l: X(c).toFixed(1), t: Y(r).toFixed(1), w: W(w).toFixed(1), h: H(h).toFixed(1), bg: '#221F2B', ring: '#34304A', ringW: 1, keys: [], pads: [], fill: false, fillH: 0, label: '' }, o); };
    var keyW = W(5) / 10, keys = [];
    for (var i = 0; i < 10; i++) keys.push({ l: Math.round(i * keyW), w: Math.round(keyW - 3), h: Math.round(H(3)) });
    var pads = [], pw = (W(4) - 3 * 6 - 12) / 4, ph = (H(3) - 2 * 6 - 34) / 3;
    for (var pr = 0; pr < 3; pr++) for (var pc = 0; pc < 4; pc++) pads.push({ l: Math.round(6 + pc * (pw + 6)), t: Math.round(28 + pr * (ph + 6)), w: Math.round(pw), h: Math.round(ph) });
    var ctrls = [
      box(0, 0, 3, 3, { bg: '#000000', label: 'Screen ×1' }),
      box(3, 0, 1, 1, { label: 'PLAY' }), box(3, 1, 1, 1, { label: 'REC' }), box(3, 2, 1, 1, { label: 'SEQ' }),
      box(0, 3, 4, 3, { bg: '#1C1925', label: 'Pads', pads: pads, ring: '#C6F24E', ringW: 2 }),
      box(5, 0, 1, 6, { label: 'Tempo', fill: true, fillH: 180 }),
      box(6, 0, 1, 4, { label: 'Swing', fill: true, fillH: 80 }),
      box(9, 3, 5, 3, { bg: '#1C1925', keys: keys })
    ];
    var x0 = X(0), y0 = Y(3), x1 = X(0) + W(4), y1 = Y(3) + H(3);
    var handles = [[x0, y0], [x1, y0], [x0, y1], [x1, y1]].map(function (p) { return { l: Math.round(p[0] - 9), t: Math.round(p[1] - 9) }; });
    var badge = { l: Math.round(x0 + 46), t: Math.round(y0 + 5) };
    var plus = { l: X(7).toFixed(1), t: Y(1).toFixed(1), w: cw.toFixed(1), h: ch.toFixed(1) };
    var items = [['Button', '1×1', true], ['Knob', '1×1', true], ['Slider', '1×2 +', true], ['XY pad', '2×2 +', true], ['Pad grid', '2×2 +', true], ['Strum strip', '1×3 +', true], ['Keyboard strip', 'needs 4×2', false], ['Firmware screen', 'needs 3×3', false]];
    var menu = items.map(function (m) { return { name: m[0], size: m[1], bg: m[2] ? '#E2DCEB' : 'transparent', fg: m[2] ? '#14121A' : '#8F89A3', sub: m[2] ? '#5E5870' : '#B4472F' }; });
    return { cells: cells, ctrls: ctrls, handles: handles, badge: badge, plus: plus, menu: menu };
  }
}
</script>
</body>
</html>
