<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout editor and binding sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 0">
    <button type="button" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3EFF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div style="flex: 1; line-height: 1.2"><div style="font-size: 16px; font-weight: 700">Drum pads</div><div style="font-size: 12px; color: #A9A3B8">Layout for X0X · edited</div></div>
    <button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #C6F24E; color: #14121A; font: 700 14px Inter, sans-serif">Done</button>
  </div>

  <div style="position: relative; margin: 12px 16px 0; height: 166px; border-radius: 12px; background: #0E0D12; box-shadow: inset 0 0 0 1px #34304A; overflow: hidden">
    <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: #FF9A7A; opacity: 0.12"></div>
    <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 12px; background: #FF9A7A; opacity: 0.12"></div>
    <div style="position: absolute; left: 12px; top: 5px; width: 207px; height: 156px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px">
      <sc-for list="{{pads}}" as="p" hint-placeholder-count="16"><div style="border-radius: 5px; background: {{p}}"></div></sc-for>
    </div>
    <div style="position: absolute; left: 10px; top: 82px; width: 54px; height: 41px; box-sizing: border-box; border: 2px solid #C6F24E; border-radius: 6px"></div>
    <div style="position: absolute; left: 5px; top: 77px; width: 10px; height: 10px; background: #C6F24E; border-radius: 5px"></div>
    <div style="position: absolute; left: 59px; top: 77px; width: 10px; height: 10px; background: #C6F24E; border-radius: 5px"></div>
    <div style="position: absolute; left: 5px; top: 118px; width: 10px; height: 10px; background: #C6F24E; border-radius: 5px"></div>
    <div style="position: absolute; left: 59px; top: 118px; width: 10px; height: 10px; background: #C6F24E; border-radius: 5px"></div>
    <div style="position: absolute; left: 228px; top: 5px; width: 73px; height: 73px; background: #000000; box-shadow: inset 0 0 0 1px #3A3548"></div>
    <div style="position: absolute; left: 228px; top: 84px; width: 118px; height: 24px; display: flex; gap: 3px"><div style="flex: 1; border-radius: 4px; background: #2E2A3B"></div><div style="flex: 1; border-radius: 4px; background: #2E2A3B"></div><div style="flex: 1; border-radius: 4px; background: #2E2A3B"></div></div>
    <div style="position: absolute; left: 228px; top: 114px; width: 118px; height: 20px; border-radius: 4px; background: #2E2A3B"></div>
    <div style="position: absolute; left: 228px; top: 138px; width: 118px; height: 20px; border-radius: 4px; background: #2E2A3B"></div>
    <span style="position: absolute; right: 8px; top: 8px; font: 600 9px/1 'JetBrains Mono', monospace; color: #A9A3B8">rotate phone to edit full size</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 12px 16px 0">
    <sc-for list="{{palette}}" as="t" hint-placeholder-count="10">
      <button type="button" style="height: 52px; border-radius: 12px; border: none; background: #1C1925; color: #E4DFEE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 10px Inter, sans-serif; padding: 0">
        <svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="#C6F24E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.label}}
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 474px; border-radius: 24px 24px 0 0; background: #1C1925; padding: 10px 16px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #4A4560; margin: 0 auto"></div>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800">Pad · HAT C</h2>
      <span style="font: 600 11px/1 'JetBrains Mono', monospace; color: #A9A3B8">drives</span>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #14121A">
      <button type="button" role="tab" aria-selected="true" style="height: 40px; border-radius: 10px; border: none; background: #34304A; color: #F3EFF8; font: 600 13px Inter, sans-serif">Firmware input</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #A9A3B8; font: 600 13px Inter, sans-serif">MIDI note / CC</button>
    </div>

    <div style="border-radius: 16px; background: #14121A; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 8px; align-items: center; height: 54px">
        <div style="display: grid; grid-template-columns: repeat(2, 18px); gap: 6px"><span style="width: 18px; height: 18px; border-radius: 9px; background: #2E2A3B; box-shadow: inset 0 0 0 2px #FFB547"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #2E2A3B"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #2E2A3B"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #2E2A3B"></span></div>
        <div style="width: 54px; height: 54px; background: #000000; box-shadow: inset 0 0 0 1px #3A3548; margin: 0 6px"></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 9px; background: #2E2A3B"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #2E2A3B"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #2E2A3B"></span><span style="width: 18px; height: 18px; border-radius: 9px; background: #2E2A3B"></span></div>
          <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px"><sc-for list="{{btns}}" as="b" hint-placeholder-count="12"><span style="height: 12px; border-radius: 3px; background: #2E2A3B"></span></sc-for></div>
        </div>
      </div>
      <div style="position: relative; height: 70px">
        <sc-for list="{{whites}}" as="k" hint-placeholder-count="16"><div style="position: absolute; left: {{k.l}}px; top: 0; width: {{k.w}}px; height: 70px; border-radius: 0 0 4px 4px; background: {{k.bg}}"></div></sc-for>
        <sc-for list="{{blacks}}" as="k" hint-placeholder-count="11"><div style="position: absolute; left: {{k.l}}px; top: 0; width: 13px; height: 42px; border-radius: 0 0 3px 3px; background: #2A2633; box-shadow: 0 0 0 1px #14121A"></div></sc-for>
        <span style="position: absolute; left: 40px; top: 74px; padding: 2px 5px; border-radius: 5px; background: #14121A; color: #C6F24E; font: 700 10px/1 'JetBrains Mono', monospace">A3</span>
      </div>
      <p style="margin: 0; font-size: 12px; line-height: 1.4; color: #A9A3B8">Tap a key, knob or button. Add more to send them together. Amber ring: ALGO is also bound, from this pad’s long-press.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 6px; border-radius: 16px; background: #2A2636; font: 600 12px/1 'JetBrains Mono', monospace"><span style="width: 20px; height: 20px; border-radius: 10px; background: #ECE7F2; color: #14121A; display: inline-flex; align-items: center; justify-content: center; font-size: 10px">K</span>key A3 · press</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 6px; border-radius: 16px; background: #2A2636; font: 600 12px/1 'JetBrains Mono', monospace"><span style="width: 20px; height: 20px; border-radius: 10px; background: #FFB547; color: #14121A; display: inline-flex; align-items: center; justify-content: center; font-size: 10px">E</span>ALGO +1 · long-press</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #14121A">
      <button type="button" style="height: 40px; border-radius: 10px; border: none; background: #34304A; color: #F3EFF8; font: 600 13px Inter, sans-serif">Momentary</button>
      <button type="button" style="height: 40px; border-radius: 10px; border: none; background: transparent; color: #A9A3B8; font: 600 13px Inter, sans-serif">Toggle</button>
    </div>

    <div style="margin-top: auto; display: flex; gap: 8px">
      <button type="button" style="flex: 1; height: 48px; border-radius: 14px; border: none; background: transparent; box-shadow: inset 0 0 0 1px #4A4560; color: #F3EFF8; font: 600 14px Inter, sans-serif">Reset to classic</button>
      <button type="button" style="flex: 1; height: 48px; border-radius: 14px; border: none; background: #2A2636; color: #F3EFF8; font: 600 14px Inter, sans-serif">Share layout</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var pads = []; for (var i = 0; i < 16; i++) pads.push(i === 8 ? '#3A3450' : '#221F2B');
    var palette = [
      ['Key', 'M5 2h10v12H5z'], ['Keys', 'M1 2h18v12H1zM6 2v12M10 2v12M14 2v12'], ['Pads', 'M2 2h7v5H2zM11 2h7v5h-7zM2 9h7v5H2zM11 9h7v5h-7z'], ['Button', 'M3 4h14v8H3z'], ['Knob', 'M10 2a6 6 0 1 0 0.01 0M10 8V4'],
      ['Slider', 'M10 1v14M6 9h8'], ['XY pad', 'M2 2h16v12H2zM10 2v12M2 8h16'], ['Strum', 'M2 3h16M2 6h16M2 9h16M2 12h16'], ['Screen', 'M4 1h12v14H4z'], ['Label', 'M3 4h14M10 4v10']
    ].map(function (p) { return { label: p[0], icon: p[1] }; });
    var btns = []; for (var b = 0; b < 12; b++) btns.push(b);
    var colW = 334 / 16;
    var whites = []; for (var w = 0; w < 16; w++) whites.push({ l: Math.round(w * colW), w: Math.round(colW - 2), bg: w === 2 ? '#C6F24E' : '#ECE7F2' });
    var blacks = [0, 1, 2, 4, 5, 7, 8, 9, 11, 12, 14].map(function (i) { return { l: Math.round((i + 1) * colW - 7.5) }; });
    return { pads: pads, palette: palette, btns: btns, whites: whites, blacks: blacks };
  }
}
</script>
</body>
</html>
