# GenericJam/fmutate-cartridges: .github/workflows/cartridges.yml
# Builds FM-1 Firmware Hub firmwares as FMutate native cartridges, checks each against the same firmware's Hub package
# in the emulator, and publishes the ones that match as signed release assets plus a signed index
# (https://genericjam.github.io/fmutate-cartridges/index.json). One firmware per job; the daily run builds only what
# the Hub changed since the published index (pipeline/plan.py). Decision record: FMutate
# docs/decisions/2026-11-14-native-catalog.md.
name: cartridges

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Firmware ids to build (space-separated); empty = new or changed on the Hub"
        required: false
        default: ""
      all:
        description: "Rebuild every firmware"
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: cartridges
  cancel-in-progress: false

env:
  # the FMutate commit whose engine (native/engine) and emulator engine (native/emu) the cartridges are checked with
  FMUTATE_REF: master
  FM1_CATALOG_DIR: ${{ github.workspace }}/work
  FM1_ENGINE_DIR: ${{ github.workspace }}/engine
  NDK_VERSION: r27c

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.plan.outputs.ids }}
      any: ${{ steps.plan.outputs.any }}
      hub_updated: ${{ steps.plan.outputs.hub_updated }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pins from the Hub's catalogue
        run: |
          curl -fsSL -A fmutate-cartridges -o catalog.json https://thefirmwarehub.com/catalog.json
          python3 pipeline/pins.py catalog.json
      - id: plan
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then ids=$(python3 pipeline/plan.py --all)
          else ids=$(python3 pipeline/plan.py ${{ inputs.ids }}); fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          [ "$ids" = "[]" ] && echo "any=false" >> "$GITHUB_OUTPUT" || echo "any=true" >> "$GITHUB_OUTPUT"
          echo "hub_updated=$(python3 -c 'import json; print(json.load(open("catalog.json"))["updated"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: pins, path: pipeline/pins.json }

  engine:
    # the engines the checks run the cartridges and packages in, built once per run for Linux x86-64
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: GenericJam/fmutate, ref: "${{ env.FMUTATE_REF }}", path: fmutate }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: fmutate/native/build/emu-target
          key: emu-${{ runner.os }}-${{ hashFiles('fmutate/native/emu/**', 'fmutate/native/build_emu.sh') }}
      - run: |
          mkdir -p engine
          cc -O2 -o engine/libfm1engine.so fmutate/native/engine/fm1engine.c -ldl
          cc -O2 -o engine/cartbench "$GITHUB_WORKSPACE/fmutate/native/engine/../../tools/native_catalog/cartbench.c" -ldl -lm 2>/dev/null || true
          ABIS="" sh fmutate/native/build_emu.sh
          cp fmutate/native/build/host/libfm1emu.so engine/
      - uses: actions/upload-artifact@v4
        with: { name: engine, path: engine }

  android:
    needs: [plan, engine]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pins, path: pipeline }
      - uses: actions/download-artifact@v4
        with: { name: engine, path: engine }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          sudo apt-get install -y -q libfribidi0 >/dev/null
          pip install -q Pillow numpy
          chmod +x engine/*
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: "${{ env.NDK_VERSION }}", add-to-path: false }
      - name: Fetch ${{ matrix.id }}
        run: sh pipeline/fetch.sh ${{ matrix.id }}
      - name: Build (this computer) and check against the emulator
        continue-on-error: true
        run: |
          python3 pipeline/build.py ${{ matrix.id }} --target host
          python3 pipeline/verify.py ${{ matrix.id }}
      - name: Build (Android)
        continue-on-error: true
        env: { ANDROID_NDK_HOME: "${{ steps.ndk.outputs.ndk-path }}" }
        run: |
          for t in android-arm64-v8a android-x86_64 android-armeabi-v7a; do
            python3 pipeline/build.py ${{ matrix.id }} --target $t || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cart-android-${{ matrix.id }}
          path: |
            work/results/
            work/verify/${{ matrix.id }}.*
            work/out/
          if-no-files-found: ignore

  ios:
    needs: [plan, android]
    if: needs.plan.outputs.any == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pins, path: pipeline }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          brew install fribidi >/dev/null
          pip install -q Pillow numpy
      - run: sh pipeline/fetch.sh ${{ matrix.id }}
      - continue-on-error: true
        run: |
          for t in ios-device ios-sim; do python3 pipeline/build.py ${{ matrix.id }} --target $t || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cart-ios-${{ matrix.id }}
          path: |
            work/results/*.ios-*.json
            work/out/ios-*/
          if-no-files-found: ignore

  publish:
    needs: [plan, android, ios]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pins, path: pipeline }
      - uses: actions/download-artifact@v4
        with: { pattern: "cart-*", path: artifacts }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy
      - name: Index, signed
        env: { SIGNING_KEY: "${{ secrets.CARTRIDGE_SIGNING_KEY }}" }
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > key.pem
          tag="build-$(date -u +%Y%m%d)-${{ github.run_number }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          python3 pipeline/publish.py --artifacts artifacts --tag "$tag" --out dist --key key.pem \
            --prev https://genericjam.github.io/fmutate-cartridges/index.json --hub-updated "${{ needs.plan.outputs.hub_updated }}"
          rm -f key.pem
      - name: Release assets
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if ls dist/assets/* >/dev/null 2>&1; then
            for i in 1 2 3; do
              gh release create "$TAG" dist/assets/* --title "$TAG" --notes "Cartridges built by run ${{ github.run_id }}" && break
              sleep 20
            done
          fi
      - name: Index to GitHub Pages (gh-pages)
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || git branch gh-pages
          git worktree add pages gh-pages
          cp dist/index.json dist/index.json.sig pages/
          cd pages
          git add index.json index.json.sig
          git -c user.name=fmutate-cartridges -c user.email=actions@github.com commit -m "index: run ${{ github.run_number }}" || exit 0
          git push origin gh-pages
